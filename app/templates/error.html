{% extends "base.html" %}
{% block title %}Error {{ error_code }} - FastTrackChef{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">{{ error_code or 'Error' }}</h1>
    <p class="lead">{{ error_message or 'Something went wrong.' }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-danger mt-3"><i class="bi bi-house"></i> Go Home</a>
</div>
{% endblock %}
